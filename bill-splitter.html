<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill Splitter</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #f0f2f5; margin: 0; padding: 30px 16px; }
  .card { max-width: 420px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  h1 { text-align: center; margin-top: 0; font-size: 26px; }
  label { display: block; font-weight: bold; margin: 14px 0 6px; }
  input, select { width: 100%; padding: 10px; font-size: 15px; border: 1px solid #999; border-radius: 4px; box-sizing: border-box; }
  button { width: 100%; margin-top: 18px; padding: 12px; font-size: 16px; color: #fff; background: #333; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #111; }
  #result { margin-top: 18px; padding: 14px; background: #eee; border-radius: 6px; line-height: 1.7; min-height: 20px; }
  .error { color: red; }
</style>
</head>
<body>
  <div class="card">
    <h1>Bill Splitter</h1>

    <label for="bill">Bill amount (Rs.)</label>
    <input type="number" id="bill" placeholder="e.g. 1200">

    <label for="tip">Tip</label>
    <select id="tip">
      <option value="0">0%</option>
      <option value="5">5%</option>
      <option value="10" selected>10%</option>
      <option value="15">15%</option>
    </select>

    <label for="people">Number of people</label>
    <input type="number" id="people" value="1">

    <button id="calcBtn">Calculate</button>

    <div id="result"></div>
  </div>

<script>
  document.getElementById("calcBtn").addEventListener("click", function () {
    // Read the three values and convert them to numbers
    var bill = parseFloat(document.getElementById("bill").value);
    var tipPercent = parseFloat(document.getElementById("tip").value);
    var people = parseInt(document.getElementById("people").value);
    var result = document.getElementById("result");

    // Validation: bill empty / not above 0, or people less than 1
    if (isNaN(bill) || bill <= 0 || isNaN(people) || people < 1) {
      result.className = "error";
      result.innerHTML = "Please enter a valid bill and number of people.";
      return;
    }

    // Calculation
    var tipAmount = bill * tipPercent / 100;
    var total = bill + tipAmount;
    var perPerson = total / people;

    result.className = "";
    result.innerHTML =
      "Tip amount: <b>Rs. " + tipAmount.toFixed(2) + "</b><br>" +
      "Total bill: <b>Rs. " + total.toFixed(2) + "</b><br>" +
      "Each person pays: <b>Rs. " + perPerson.toFixed(2) + "</b>";
  });
</script>
</body>
</html>
